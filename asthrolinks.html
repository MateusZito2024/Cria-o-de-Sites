<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | Agência Asthro</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/MateusZito2024/Cria-o-de-Sites/refs/heads/main/LOGO%20PNG.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #030303;
            --primary-glow: #6a00ff;
            --secondary-glow: #00d4ff;
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #b0b0b0;
            --accent-gradient: linear-gradient(135deg, #6a00ff, #00d4ff);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Fundo Dinâmico Melhorado */
        .background-fx {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 20%, rgba(106, 0, 255, 0.15), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 212, 255, 0.15), transparent 40%);
        }

        /* Container Principal com entrada suave */
        .container {
            width: 100%;
            max-width: 500px;
            z-index: 1;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Foto de Perfil com Animação de Pulso */
        .profile-img-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 3px;
            background: var(--accent-gradient);
            transition: transform 0.3s ease;
        }

        .profile-img-container:hover {
            transform: scale(1.05);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #000;
            border: 2px solid #000;
        }

        .profile-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .profile-bio {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 35px;
            line-height: 1.5;
        }

        /* Botões Aprimorados */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            position: relative;
            display: flex;
            align-items: center;
            padding: 18px 25px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .link-btn i {
            width: 30px;
            font-size: 1.2rem;
            margin-right: 15px;
            transition: transform 0.3s ease;
        }

        /* Efeito de brilho interno no hover */
        .link-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateX(5px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
        }

        .link-btn:hover i {
            transform: scale(1.2);
            color: var(--secondary-glow);
        }

        /* Botão de Destaque */
        .highlight {
            background: linear-gradient(135deg, rgba(106, 0, 255, 0.1), rgba(0, 212, 255, 0.1));
            border-color: rgba(106, 0, 255, 0.3);
        }

        .highlight::after {
            content: 'POPULAR';
            position: absolute;
            right: -15px;
            top: 5px;
            background: var(--accent-gradient);
            font-size: 0.6rem;
            padding: 2px 15px;
            transform: rotate(45deg);
            font-weight: 800;
        }

        /* Rodapé Minimalista */
        .footer {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #555;
            letter-spacing: 0.5px;
            line-height: 1.6;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .social-icon {
            color: var(--text-muted);
            font-size: 1.4rem;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            color: #fff;
            transform: translateY(-3px);
            filter: drop-shadow(0 0 8px var(--primary-glow));
        }

        /* Melhoria Mobile */
        @media (max-width: 480px) {
            .profile-card { padding: 30px 20px; }
            .profile-title { font-size: 1.5rem; }
            .link-btn { padding: 16px 20px; }
        }
    </style>
</head>
<body>

    <div class="background-fx"></div>

    <div class="container">
        <main class="profile-card">
            
            <div class="profile-img-container">
                <img src="https://raw.githubusercontent.com/MateusZito2024/Cria-o-de-Sites/refs/heads/main/LOGO%20PNG.png" alt="Logo Agência Asthro" class="profile-img">
            </div>
            
            <h1 class="profile-title">Agência Asthro</h1>
            <p class="profile-bio">Transformando ideias em experiências digitais de alto impacto.</p>

            <nav class="links-container">
                <a href="https://asthro.com.br" class="link-btn highlight" target="_blank" rel="noopener">
                    <i class="fa-solid fa-globe"></i>
                    <span>Site Oficial</span>
                </a>
                
                <a href="https://mateuszito2024.github.io/Cria-o-de-Sites/serviços.html" class="link-btn" target="_blank" rel="noopener">
                    <i class="fa-solid fa-rocket"></i>
                    <span>Nossos Serviços</span>
                </a>

                <a href="https://asthro.com.br/asthrocolors.html" class="link-btn" target="_blank" rel="noopener">
                    <i class="fa-solid fa-palette"></i>
                    <span>AsthroColors</span>
                </a>

                <a href="https://mateuszito2024.github.io/Cria-o-de-Sites/portfólio.html" class="link-btn" target="_blank" rel="noopener">
                    <i class="fa-solid fa-briefcase"></i>
                    <span>Portfólio</span>
                </a>
                
                <a href="https://mateuszito2024.github.io/Cria-o-de-Sites/contato.html" class="link-btn" target="_blank" rel="noopener">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span>Falar no WhatsApp</span>
                </a>
            </nav>

            <div class="social-links">
                <a href="https://www.instagram.com/agencia_asthro/" class="social-icon" target="_blank" rel="noopener" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://www.tiktok.com/@asthroagencia" class="social-icon" target="_blank" rel="noopener" aria-label="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
                <a href="https://www.youtube.com/@asthroagência" class="social-icon" target="_blank" rel="noopener" aria-label="YouTube">
                    <i class="fa-brands fa-youtube"></i>
                </a>
            </div>

            <footer class="footer">
                <p>CNPJ: 64.229.666/0001-07</p>
                <p>&copy; 2026 Agência Asthro. Todos os direitos reservados.</p>
            </footer>
        </main>
    </div>

</body>
</html>
